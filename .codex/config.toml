# Project-local Codex configuration for Ruflo.
# Keep the project sandboxed and require user approval for broader actions.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[mcp_servers.ruflo]
enabled = true
required = false
command = "cmd"
args = ["/d", "/s", "/c", "npx", "--yes", "ruflo@3.32.9", "mcp", "start"]
startup_timeout_sec = 60.0
tool_timeout_sec = 120.0

[mcp_servers.ruflo.env]
npm_config_update_notifier = "false"
CLAUDE_FLOW_MODE = "v3"
CLAUDE_FLOW_HOOKS_ENABLED = "true"
CLAUDE_FLOW_TOPOLOGY = "hierarchical"
CLAUDE_FLOW_MAX_AGENTS = "4"
CLAUDE_FLOW_MEMORY_BACKEND = "sqlite"
RUFLO_DAEMON_AUTOSTART = "true"
