<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Трекер чеков{% endblock %}</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<a class="skip-link" href="#main-content">К содержимому</a>
<nav class="app-shell navbar navbar-expand-lg">
    <div class="container-fluid app-container">
        <a class="navbar-brand" href="{{ url_for('index') }}">
            <span class="brand-mark"><i class="bi bi-receipt" aria-hidden="true"></i></span>
            <span>Трекер чеков</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Открыть меню">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('index') }}"><i class="bi bi-list-ul" aria-hidden="true"></i> Чеки</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('upload') }}"><i class="bi bi-cloud-arrow-up" aria-hidden="true"></i> Загрузка</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('analytics') }}"><i class="bi bi-bar-chart" aria-hidden="true"></i> Аналитика</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('products_merge') }}"><i class="bi bi-diagram-3" aria-hidden="true"></i> Объединение</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('product_suggestions') }}"><i class="bi bi-search-heart" aria-hidden="true"></i> Похожие товары</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="app-container page-content" id="main-content">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
