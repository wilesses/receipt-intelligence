{% extends "base.html" %}
{% block title %}Аналитика{% endblock %}
{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Обзор</p>
        <h1>Аналитика</h1>
    </div>
    <div class="analytics-metrics" aria-label="Ключевые показатели">
        <div class="total-chip">
            <span>Всего</span>
            <strong id="totalSpent" aria-live="polite">—</strong>
        </div>
        <div class="total-chip">
            <span>В среднем / месяц</span>
            <strong id="monthlyAverage" aria-live="polite">—</strong>
        </div>
    </div>
</section>

<section class="surface filters-surface">
    <div class="filters-grid">
        <label>
            <span>Начало</span>
            <input type="date" class="form-control" id="startDate" name="start" autocomplete="off">
        </label>
        <label>
            <span>Конец</span>
            <input type="date" class="form-control" id="endDate" name="end" autocomplete="off">
        </label>
        <label>
            <span>Магазин</span>
            <select class="form-select" id="storeFilter" name="store" autocomplete="off">
                <option value="">Все</option>
                <option>Maxima</option>
                <option>Rimi</option>
                <option>Lidl</option>
            </select>
        </label>
        <label>
            <span>Категория</span>
            <select class="form-select" id="categoryFilter" name="category" autocomplete="off">
                <option value="">Все</option>
                {% for category in category_options %}
                    <option value="{{ category }}">{{ category }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            <span>Товар</span>
            <input type="search" id="itemFilter" name="item" class="form-control" placeholder="Название…" autocomplete="off">
        </label>
        <button class="btn btn-primary" id="applyFilters">
            <i class="bi bi-funnel" aria-hidden="true"></i>
            Применить
        </button>
    </div>
</section>

<section class="charts-grid">
    <div class="surface chart-card">
        <div class="section-title">
            <h2>Категории</h2>
        </div>
        <div class="chart-frame">
            <canvas id="categoryChart"></canvas>
        </div>
    </div>
    <div class="surface chart-card">
        <div class="section-title">
            <h2>Месяцы</h2>
        </div>
        <div class="chart-frame">
            <canvas id="monthChart"></canvas>
        </div>
    </div>
</section>

<section class="surface chart-card wide-chart">
    <div class="section-title">
        <h2>Топ товаров</h2>
    </div>
    <div class="chart-frame chart-frame-wide">
        <canvas id="topItemsChart"></canvas>
    </div>
    <div id="topItemLinks" class="link-strip">
        <ul class="list-unstyled" id="topItemList"></ul>
    </div>
</section>

<section class="surface chart-card wide-chart">
    <div class="section-title">
        <h2>Динамика цены</h2>
    </div>
    <div class="trend-toolbar">
        <label class="visually-hidden" for="itemTrendInput">Товар для динамики цены</label>
        <input type="search" id="itemTrendInput" name="trend_item" class="form-control" placeholder="Название товара…" autocomplete="off">
        <button class="btn btn-outline-primary" onclick="loadTrendChart()">
            <i class="bi bi-graph-up" aria-hidden="true"></i>
            Показать
        </button>
    </div>
    <div class="chart-frame chart-frame-wide">
        <canvas id="trendChart"></canvas>
        <p id="trendMsg" class="empty-message" aria-live="polite"></p>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script>
let categoryChart, monthChart, topChart, trendChart;

document.getElementById('applyFilters').addEventListener('click', loadAnalytics);

async function loadAnalytics() {
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    const store = document.getElementById('storeFilter').value;
    const category = document.getElementById('categoryFilter').value;
    const item = document.getElementById('itemFilter').value;
    const params = new URLSearchParams({ start, end, store, category, item });
    const response = await fetch(`/analytics/data?${params.toString()}`);
    const data = await response.json();

    document.getElementById("totalSpent").textContent = data.total_spent.toFixed(2) + " €";
    document.getElementById("monthlyAverage").textContent = data.monthly_average.toFixed(2) + " €";
    const colors = ['#2563eb','#16a34a','#f59e0b','#dc2626','#7c3aed','#0891b2','#ea580c','#0f766e','#4b5563','#be123c'];

    if (categoryChart) categoryChart.destroy();
    if (monthChart) monthChart.destroy();
    if (topChart) topChart.destroy();

    categoryChart = new Chart(document.getElementById('categoryChart'), {
        type: 'doughnut',
        data: {
            labels: data.categories.labels,
            datasets: [{ data: data.categories.values, backgroundColor: colors, borderWidth: 0 }]
        },
        options: {
            maintainAspectRatio: false,
            cutout: '62%',
            plugins: {
                legend: { position: 'bottom' },
                datalabels: { display: false }
            }
        },
        plugins: [ChartDataLabels]
    });

    monthChart = new Chart(document.getElementById('monthChart'), {
        type: 'line',
        data: {
            labels: data.months.labels,
            datasets: [{
                label: 'Расходы',
                data: data.months.values,
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, .08)',
                fill: true,
                tension: .25,
                pointRadius: 3
            }]
        },
        options: {
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, datalabels: { display: false } },
            scales: { y: { beginAtZero: true } }
        },
        plugins: [ChartDataLabels]
    });

    topChart = new Chart(document.getElementById('topItemsChart'), {
        type: 'bar',
        data: {
            labels: data.top.labels,
            datasets: [{ label: 'Сумма', data: data.top.values, backgroundColor: '#0f766e', borderRadius: 6 }]
        },
        options: {
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, datalabels: { display: false } },
            scales: { y: { beginAtZero: true } }
        },
        plugins: [ChartDataLabels]
    });

    const listEl = document.getElementById('topItemList');
    listEl.innerHTML = "";
    data.top.labels.forEach(name => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "/item/" + encodeURIComponent(name);
        a.textContent = name;
        li.appendChild(a);
        listEl.appendChild(li);
    });
}

async function loadTrendChart() {
    const itemName = document.getElementById('itemTrendInput').value.trim();
    if (!itemName) return;

    const res = await fetch(`/analytics/item_trend?item=${encodeURIComponent(itemName)}`);
    const data = await res.json();

    if (trendChart) trendChart.destroy();

    if (!data || data.labels.length === 0) {
        document.getElementById('trendMsg').textContent = "Нет данных";
        return;
    }

    document.getElementById('trendMsg').textContent = "";
    trendChart = new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: {
            labels: data.labels,
            datasets: [{
                label: "Цена за единицу",
                data: data.values.map(v => (isFinite(v) && v > 0 ? v : null)),
                borderColor: '#0f766e',
                backgroundColor: 'rgba(15, 118, 110, .08)',
                fill: true,
                tension: .25
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, datalabels: { display: false } },
            scales: { y: { beginAtZero: true } }
        },
        plugins: [ChartDataLabels]
    });
}

loadAnalytics();
</script>
{% endblock %}
